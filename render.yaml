services:
  - type: web
    name: xo-arena
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: 'gunicorn --worker-class gthread --workers 1 --threads 100 --bind 0.0.0.0:$PORT app:app'
    healthCheckPath: /
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
